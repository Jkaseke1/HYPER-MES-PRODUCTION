<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="cache-control" content="no-store" />
    <title>PlantControl Recovery</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #10233a; font-family: Arial, sans-serif; }
      main { max-width: 420px; padding: 32px; text-align: center; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0; color: #51657d; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Refreshing PlantControl</h1>
      <p>Clearing the retired application cache and opening the current release.</p>
    </main>
    <script>
      (async () => {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
          }
        } finally {
          window.location.replace('./#/?cache-reset=' + Date.now());
        }
      })();
    </script>
  </body>
</html>
