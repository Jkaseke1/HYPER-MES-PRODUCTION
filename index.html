    <script>
      // Clean query parameters like ?v=timestamp before hash routes
      (function() {
        var l = window.location;
        if (l.search && l.hash) {
          var cleanUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname + l.hash;
          window.history.replaceState(null, '', cleanUrl);
        }
      })();
    </script>
